# Render Free Blueprint — API katmanı
# Model basit olduğu için 512MB yeterli; ağır indexleme worker'da.
services:
  - type: web
    name: momenz-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MOMENZ_ENVIRONMENT
        value: prod
      - key: MOMENZ_JWT_SECRET
        generateValue: true          # Render güvenli secret üretir
      - key: MOMENZ_COOKIE_SECURE
        value: true
      - key: MOMENZ_API_BASE_URL
        value: https://momenz.onrender.com
      - key: MOMENZ_TRUSTED_HOSTS
        value: momenz.onrender.com,localhost
      - key: MOMENZ_CORS_ORIGINS
        value: https://momenz.vercel.app
      # 512 MB sınırı için bellek ayarları (kod varsayılanlarıyla aynı).
      - key: MOMENZ_SEARCH_CACHE_MAX_FOLDERS
        value: "1"
      - key: MOMENZ_WEB_BASE_URL
        value: https://momenz.vercel.app
      - key: MOMENZ_MAIL_RESET_URL
        value: https://momenz.vercel.app/sifre-sifirla?token={token}
      - key: MOMENZ_TURSO_DATABASE_URL
        sync: false
      - key: MOMENZ_TURSO_AUTH_TOKEN
        sync: false
      - key: MOMENZ_GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MOMENZ_SMTP_HOST
        value: smtp.gmail.com
      - key: MOMENZ_SMTP_PORT
        value: "587"
      - key: MOMENZ_SMTP_USER
        sync: false
      - key: MOMENZ_SMTP_PASSWORD
        sync: false
      - key: MOMENZ_MAIL_FROM
        value: Momenz <no-reply@mome.nz>
